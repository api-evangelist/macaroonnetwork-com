method: derived
source: Derived by aligning the live MCP tools/list of both servers (mcp/macaroonnetwork-com-mcp-tools.json, mcp/macaroonnetwork-com-bible-evidence-mcp-tools.json)
  and the three package-only tools named in the PyPI README with the OpenAPI at openapi/macaroonnetwork-com-openapi.json
  (120 operations). Every operationId below was checked against the spec by the script that wrote this file.
purpose: Make each MCP tool a first-class discovery unit bound to its backing REST operation so the tool inherits
  a real inputSchema; record where the MCP surface (Lightning L402 feeds) has no public REST twin and where the
  REST surface has no tool.
surfaces:
