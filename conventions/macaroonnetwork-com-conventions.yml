  rfc9457: false
  shape: '{ "detail": string | ValidationError[] }; 402 carries the x402 JSON body + PAYMENT-REQUIRED header; JSON-RPC error objects on MCP/A2A'
  detail: errors/macaroonnetwork-com-problem-types.yml
rate_limits:
  signal_status: undocumented (no 429 declared)
  headers: none; x-request-id only
  quotas: free-tier allowances per agent per capability; subscription quotas
  detail: rate-limits/macaroonnetwork-com-rate-limits.yml
webhooks:
  supported: false
  note: No webhook, callback or AsyncAPI surface. "Change feed" listings (tx-new-business-change-feed-v1, uk-logistics-operator-change-feed-v1, gpu-llm-pricing-changes-v1) are pull-based paid queries; the Logistics Pro watchlist sends human email alerts.
robots:
  api_host: 'User-agent: * Allow: /.well-known/, /openapi.json, /listings, /execute/, /a2a, /api/public/; Disallow: /payments/, /api/provider/, /api/admin/'
  apex: 'Allow: /; Sitemap: https://macaroonnetwork.com/sitemap.xml'
other_conventions:
- name: Capability id is the join key everywhere
  detail: The same id is the OpenAPI path suffix, the A2A skill id, the MCP macaroons_execute capability_id, the api-catalog anchor, the x402 resource URL and the listing page slug.
- name: Amounts
  detail: amount_atomic is USDC in 6-decimal atomic units (3000 = 0.003 USDC); /listings also shows a legacy price_sats field.
- name: Provenance fields
  detail: Responses label source, translation/corpus version, retrieval time and a deterministic content_hash (Bible evidence); listings publish validation evidence including on-chain canary transaction hashes.
- name: Agent-facing guidance in the spec
  detail: 'info.x-guidance: "Choose a concrete POST /execute/<capability-id> operation. Send the documented JSON body, receive an x402 v2 USDC challenge on Base, then retry with PAYMENT-SIGNATURE. Treat licence status and validation claims exactly as returned; unknown evidence is not permission."'
