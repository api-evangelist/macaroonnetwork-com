  path_echo_control: passed
  note: >-
    A real, unusually complete discovery surface. The apex serves an RFC 9116 security.txt, an RFC 9728
    protected-resource document and an RFC 9727 api-catalog linkset (79 anchors, application/linkset+json);
    www mirrors the apex byte-for-byte on those paths (same origin). The API host serves the same
    protected-resource and api-catalog documents plus the A2A agent card at both the canonical and legacy
    paths, an x402 discovery document, an agent catalog (ai-catalog.json, schema macaroonnetwork.agent-catalog.v1,
    79 capabilities with input/output schemas, prices and payment rails), an agent-capabilities index and an
    llms.txt under /.well-known/. Misses are real: the apex answers its HTML 404 page (12,830 bytes) and the API
    host answers application/json {"detail":"Not Found"} (22 bytes) — not SPA shells — and a negative-control path
    that cannot exist 404s on all three hosts, so every 200 below is a served document. No OpenID/OAuth
    authorization-server discovery (consistent with auth.md: "OAuth is not implemented"), no ai-plugin.json, no
    UCP/ACP agentic-commerce manifest, no AAuth resource document and no APIs.json anywhere. One defect worth
    a provider note: both api-catalog copies point service-desc at https://macaroonnetwork.com/openapi.json,
    which returns the apex HTML 404 — the real spec is at https://api.macaroonnetwork.com/openapi.json.
