  /execute/commercial-use-licence-check-v1:
    post:
      operationId: execute_commercial_use_licence_check_v1
      summary: Commercial Use Licence Check
      description: Check a specific dataset, paper, repository, or model URL against the indexed open-science corpus and receive a conservative, source-linked commercial-use and redistribution status. Never infers permission from an absent or ambiguous licence -- returns unknown rather than guessing.
      tags:
      - RESEARCH DATA
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.003000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - url
                  properties:
                    url:
                      type: string
                      format: uri
                      description: URL or DOI link of the dataset, paper, repository, or model to check.
                    asset_type:
                      enum:
                      - dataset
                      - paper
                      - repository
                      - model
                      - government_record
                      - auto
                      type: string
                      default: auto
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.evidence
                      value: 1
                    - type: field_changed
                      field: $.limitation
                      value: Evidence summary only; not legal advice or a formal compliance determination.
                      operator: eq
              additionalProperties: false
            example:
              input:
                url: https://doi.org/10.5281/zenodo.21540550
                asset_type: auto
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.evidence
                  value: 1
                - type: field_changed
                  field: $.limitation
                  value: Evidence summary only; not legal advice or a formal compliance determination.
                  operator: eq
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - commercial_use
                    - redistribution
                    - licence
                    - attribution_required
                    - source_url
                    - evidence
                    - risk
                    - retrieved_at
                    - content_hash
                    - limitation
                    properties:
                      risk:
                        enum:
                        - low
                        - medium
                        - high
                        - unknown
                        type: string
                      licence:
                        type: string
                      evidence:
                        type: array
                        items:
                          type: object
                        minItems: 1
                      limitation:
                        type: string
                        const: Evidence summary only; not legal advice or a formal compliance determination.
                      source_url:
                        type: string
                        format: uri
                      content_hash:
                        type: string
                        pattern: ^sha256:[a-f0-9]{64}$
                      retrieved_at:
                        type: string
                        format: date-time
                      commercial_use:
                        enum:
                        - allowed
                        - restricted
                        - unknown
                        type: string
                      redistribution:
                        enum:
                        - allowed
                        - restricted
                        - unknown
                        type: string
                      attribution_required:
                        type:
                        - boolean
                        - 'null'
                    additionalProperties: false
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
