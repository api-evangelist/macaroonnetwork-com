openapi: 3.2.0
info:
  title: Macaroon Network Agent Services RESEARCH DATA API
  description: Pay-per-call scientific search, evidence, validation, and simulation services with explicit provenance and limitations.
  version: 1.0.0
  x-guidance: Choose a concrete POST /execute/<capability-id> operation. Send the documented JSON body, receive an x402 v2 USDC challenge on Base, then retry with PAYMENT-SIGNATURE. Treat licence status and validation claims exactly as returned; unknown evidence is not permission.
tags:
- name: RESEARCH DATA
paths:
  /execute/weathernext-point-forecast-v1:
    post:
      operationId: execute_weathernext_point_forecast_v1
      summary: WeatherNext Point Forecast
      description: Point-location weather forecast/reanalysis lookup from Google DeepMind's WeatherNext model via Earth Engine. Every request is bounded to data at least 1 hour old -- the exact license boundary at which WeatherNext data becomes CC BY 4.0 and commercially reusable. This listing never serves data still under the real-time Terms of Use, which explicitly prohibits commercial resale.
      tags:
      - RESEARCH DATA
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - latitude
                  - longitude
                  - timestamp
                  properties:
                    latitude:
                      type: number
                      maximum: 90
                      minimum: -90
                    longitude:
                      type: number
                      maximum: 180
                      minimum: -180
                    timestamp:
                      type: string
                      description: ISO 8601 UTC timestamp; must resolve to at least 1 hour before the request is made.
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.records
                      value: 1
                    - type: field_changed
                      field: $.provenance.license
                      value: CC-BY-4.0
                      operator: eq
                    - type: field_changed
                      field: $.provenance.live_data
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.outbound_network_used
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.data_age_hours
                      value: 1
                      operator: gte
                    - type: field_changed
                      field: $.provenance.metadata_only
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.source
                      value: Google DeepMind WeatherNext (Earth Engine)
                      operator: eq
              additionalProperties: false
            example:
              input:
                latitude: 35.6762
                longitude: 139.6503
                timestamp: '2026-01-15T12:00:00Z'
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.records
                  value: 1
                - type: field_changed
                  field: $.provenance.license
                  value: CC-BY-4.0
                  operator: eq
                - type: field_changed
                  field: $.provenance.live_data
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.outbound_network_used
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.data_age_hours
                  value: 1
                  operator: gte
                - type: field_changed
                  field: $.provenance.metadata_only
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.source
                  value: Google DeepMind WeatherNext (Earth Engine)
                  operator: eq
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - latitude
                    - longitude
                    - timestamp
                    - records
                    - provenance
                    properties:
                      records:
                        type: array
                      latitude:
                        type: number
                      longitude:
                        type: number
                      timestamp:
                        type: string
                      provenance:
                        type: object
                        required:
                        - source
                        - source_collection
                        - retrieved_at
                        - content_hash
                        - metadata_only
                        - live_data
                        - outbound_network_used
                        - license
                        - data_age_hours
                        - truncated
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/property-price-search-v1:
    post:
      operationId: execute_property_price_search_v1
      summary: UK Property Price Search
      description: Search recent UK property sale prices from HM Land Registry -- property type, price, town, district, and county. Published under the Open Government Licence v3.0. Address-line fields (postcode, street, house name/number) are deliberately excluded, since Land Registry's own licensing note flags those as carrying a separate Royal Mail restriction beyond the OGL grant on the transaction data itself.
      tags:
      - RESEARCH DATA
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - query
                  - asset_types
                  - source_ids
                  properties:
                    limit:
                      type: integer
                      default: 5
                      maximum: 5
                      minimum: 1
                    query:
                      type: string
                      description: Property type and/or location, for example 'detached london' or 'flat manchester'.
                    source_ids:
                      type: array
                      const:
                      - land-registry
                      description: Fixed source filter; send exactly ['land-registry'].
                    asset_types:
                      type: array
                      const:
                      - price
                      description: Fixed product filter; send exactly ['price'].
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.records
                      value: 1
                    - type: field_changed
                      field: $.provenance.metadata_only
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.no_outbound_network_on_purchase
                      value: true
                      operator: eq
              additionalProperties: false
            example:
              input:
                limit: 5
                query: detached london
                source_ids:
                - land-registry
                asset_types:
                - price
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.records
                  value: 1
                - type: field_changed
                  field: $.provenance.metadata_only
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.no_outbound_network_on_purchase
                  value: true
                  operator: eq
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - records
                    - total
                    - query
                    - provenance
                    properties:
                      query:
                        type: string
                      total:
                        type: integer
                      records:
                        type: array
                      provenance:
                        type: object
                        required:
                        - content_hash
                        - metadata_only
                        - no_outbound_network_on_purchase
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
