openapi: 3.2.0
info:
  title: Macaroon Network Agent Services Internal API
  description: Pay-per-call scientific search, evidence, validation, and simulation services with explicit provenance and limitations.
  version: 1.0.0
  x-guidance: Choose a concrete POST /execute/<capability-id> operation. Send the documented JSON body, receive an x402 v2 USDC challenge on Base, then retry with PAYMENT-SIGNATURE. Treat licence status and validation claims exactly as returned; unknown evidence is not permission.
tags:
- name: Internal
paths:
  /internal/universal-search:
    post:
      summary: Internal Universal Search
      description: 'Backend for universal-macaroon-search-v1''s raw_input execute

        route -- internal-only (not in Caddy''s public path allowlist for

        api.macaroonnetwork.com, same as /internal/commercial/page-view),

        reachable only via execute.py''s own loopback call to backend_url.'
      operationId: internal_universal_search_internal_universal_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniversalSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Internal Universal Search Internal Universal Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Internal
  /internal/commercial/page-view:
    post:
      summary: Commercial Page View
      operationId: commercial_page_view_internal_commercial_page_view_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialPageEvent'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Internal
components:
  schemas:
    UniversalSearchRequest:
      properties:
        query:
          type: string
          maxLength: 200
          minLength: 1
          title: Query
        filters:
          anyOf:
          - $ref: '#/components/schemas/UniversalSearchFilters'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - query
      title: UniversalSearchRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    UniversalSearchFilters:
      properties:
        category:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Category
        max_price_usdc:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Price Usdc
        limit:
          type: integer
          maximum: 25.0
          minimum: 1.0
          title: Limit
          default: 10
        include_evidence_summary:
          type: boolean
          title: Include Evidence Summary
          default: false
      additionalProperties: false
      type: object
      title: UniversalSearchFilters
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CommercialPageEvent:
      properties:
        service_id:
          type: string
          maxLength: 120
          minLength: 1
          title: Service Id
        source:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Source
      type: object
      required:
      - service_id
      title: CommercialPageEvent
