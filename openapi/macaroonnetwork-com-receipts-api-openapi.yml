openapi: 3.2.0
info:
  title: Macaroon Network Agent Services Receipts API
  description: Pay-per-call scientific search, evidence, validation, and simulation services with explicit provenance and limitations.
  version: 1.0.0
  x-guidance: Choose a concrete POST /execute/<capability-id> operation. Send the documented JSON body, receive an x402 v2 USDC challenge on Base, then retry with PAYMENT-SIGNATURE. Treat licence status and validation claims exactly as returned; unknown evidence is not permission.
tags:
- name: Receipts
paths:
  /api/receipts/{receipt_id}:
    get:
      summary: Get Receipt
      operationId: get_receipt_api_receipts__receipt_id__get
      parameters:
      - name: receipt_id
        in: path
        required: true
        schema:
          type: string
          title: Receipt Id
        description: Substitute a concrete receipt id; do not send the literal {receipt_id} template.
        example: receipt-id-from-a-paid-execution-response
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Receipts
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ReceiptResponse:
      properties:
        receipt_id:
          type: string
          title: Receipt Id
        service_id:
          type: string
          title: Service Id
        request_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Hash
        payment_network:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Network
        payment_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Reference
        payment_protocol:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Protocol
        payment_provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Provider
        challenge_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Challenge Reference
        settlement_state:
          anyOf:
          - type: string
          - type: 'null'
          title: Settlement State
        amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Amount
        currency:
          type: string
          title: Currency
        execution_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Execution Id
        predicate_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Predicate Hash
        predicate_result:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Predicate Result
        validation_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Validation Run Id
        result_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Hash
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - receipt_id
      - service_id
      - request_hash
      - payment_network
      - payment_reference
      - amount
      - currency
      - execution_id
      - predicate_hash
      - predicate_result
      - validation_run_id
      - result_hash
      - created_at
      title: ReceiptResponse
