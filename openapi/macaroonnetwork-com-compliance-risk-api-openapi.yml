openapi: 3.2.0
info:
  title: Macaroon Network Agent Services COMPLIANCE & RISK API
  description: Pay-per-call scientific search, evidence, validation, and simulation services with explicit provenance and limitations.
  version: 1.0.0
  x-guidance: Choose a concrete POST /execute/<capability-id> operation. Send the documented JSON body, receive an x402 v2 USDC challenge on Base, then retry with PAYMENT-SIGNATURE. Treat licence status and validation claims exactly as returned; unknown evidence is not permission.
tags:
- name: COMPLIANCE & RISK
paths:
  /execute/sanctions-pep-screening-v1:
    post:
      operationId: execute_sanctions_pep_screening_v1
      summary: Sanctions & PEP Screening
      description: Screen a name in one call against US OFAC SDN, the EU Consolidated Financial Sanctions List, UK OFSI, the UN Security Council Consolidated List, and Wikidata-derived Politically Exposed Persons (PEP) data -- with fuzzy name matching, not exact-only. Real competitor research (2026-09-11) found this exact bundle+fuzzy-match shape is what actually converts in this niche; the single-source exact-match ofac-sanctions-search-v1 listing did not.
      tags:
      - COMPLIANCE & RISK
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.010000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - query
                  - source_ids
                  properties:
                    query:
                      type: string
                      maxLength: 200
                      minLength: 1
                      description: Name to screen, for example 'Vladimir Putin' or 'Banco Nacional de Cuba'.
                    source_ids:
                      type: array
                      const:
                      - macaroon-internal-screening-request-v1
                      description: Fixed sentinel; send exactly this array unchanged. Selects the bundled screening path rather than plain metadata search on the same shared endpoint.
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.sources_checked
                      value: 5
              additionalProperties: false
            example:
              input:
                query: Vladimir Putin
                source_ids:
                - macaroon-internal-screening-request-v1
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.sources_checked
                  value: 5
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - query
                    - matches
                    - sources_checked
                    - risk_level
                    - generated_at
                    - content_hash
                    properties:
                      query:
                        type: string
                      matches:
                        type: array
                        items:
                          type: object
                          required:
                          - name
                          - matched_on
                          - score
                          - source_id
                          - source_name
                          - source_url
                          properties:
                            name:
                              type: string
                            score:
                              type: number
                            source_id:
                              type: string
                            matched_on:
                              enum:
                              - title
                              - alias
                              type: string
                            source_url:
                              type: string
                            source_name:
                              type: string
                            matched_alias:
                              type:
                              - string
                              - 'null'
                      risk_level:
                        enum:
                        - clear
                        - review
                        - hit
                        type: string
                      content_hash:
                        type: string
                      generated_at:
                        type: string
                      sources_checked:
                        type: array
                        items:
                          type: string
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/federal-register-search-v1:
    post:
      operationId: execute_federal_register_search_v1
      summary: Federal Register Search
      description: Search U.S. federal regulatory documents -- final rules, proposed rules, notices, and presidential documents -- by keyword, document type, issuing agency, and publication date range. The only source used is the Federal Register's own public API (federalregister.gov), published by the National Archives and Records Administration's Office of the Federal Register.
      tags:
      - COMPLIANCE & RISK
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - query
                  properties:
                    query:
                      type: string
                      maxLength: 200
                      minLength: 1
                      description: Free-text search term matched against document title/text (e.g. 'data protection', 'tariffs').
                    filters:
                      type: object
                      properties:
                        limit:
                          type: integer
                          maximum: 25
                          minimum: 1
                        agency_slug:
                          type: string
                          maxLength: 100
                          description: Exact agency slug, e.g. 'environmental-protection-agency'.
                        document_type:
                          enum:
                          - RULE
                          - PRORULE
                          - NOTICE
                          - PRESDOCU
                          type: string
                          description: RULE=Final Rule, PRORULE=Proposed Rule, NOTICE=Notice, PRESDOCU=Presidential Document.
                        published_after:
                          type: string
                          maxLength: 10
                          description: ISO date YYYY-MM-DD; only documents published on/after this date.
                        published_before:
                          type: string
                          maxLength: 10
                          description: ISO date YYYY-MM-DD; only documents published on/before this date.
                      additionalProperties: false
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.results
                      value: 1
              additionalProperties: false
            example:
              input:
                query: data protection
                filters:
                  limit: 5
                  document_type: NOTICE
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.results
                  value: 1
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - query
                    - results
                    - notices
                    properties:
                      query:
                        type: object
                        required:
                        - query
                        - filters
                        properties:
                          query:
                            type: string
                          filters:
                            type: object
                        additionalProperties: false
                      notices:
                        type: array
                        items:
                          type: string
                      results:
                        type: array
                        items:
                          type: object
                          required:
                          - title
                          - type
                          - document_number
                          - html_url
                          - pdf_url
                          - publication_date
                          - agencies
                          - licence
                          - attribution
                          - provenance
                          - content_hash
                          - limitations
                          properties:
                            type:
                              type: string
                            title:
                              type: string
                            licence:
                              type: string
                            pdf_url:
                              type: string
                            abstract:
                              type: string
                            agencies:
                              type: array
                              items:
                                type: object
                                required:
                                - name
                                - slug
                                - url
                                properties:
                                  url:
                                    type: string
                                  name:
                                    type: string
                                  slug:
                                    type: string
                                additionalProperties: false
                            html_url:
                              type: string
                            provenance:
                              type: array
                              items:
                                type: object
                                required:
                                - source
                                - source_url
                                - licence
                                - fetched_at
                                - processed_at
                                properties:
                                  source:
                                    type: string
                                  licence:
                                    type: string
                                  fetched_at:
                                    type: string
                                  source_url:
                                    type: string
                                  processed_at:
                                    type: string
                                additionalProperties: false
                            attribution:
                              type: string
                            comment_url:
                              type: string
                            limitations:
                              type: array
                              items:
                                type: string
                            content_hash:
                              type: string
                            effective_on:
                              type: string
                            document_number:
                              type: string
                            publication_date:
                              type: string
                            comments_close_on:
                              type: string
                          additionalProperties: false
                    additionalProperties: false
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/companies-house-live-discovery-v1:
    post:
      operationId: execute_companies_house_live_discovery_v1
      summary: Live UK Company Discovery
      description: Discover current UK companies through the official Companies House advanced search using bounded filters for company-name inclusion, status, type, incorporation date range, location, and five-digit SIC code. Returns at most 20 normalized company-level public-register records.
      tags:
      - COMPLIANCE & RISK
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.010000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  properties:
                    limit:
                      type: integer
                      default: 10
                      maximum: 20
                      minimum: 1
                    location:
                      type: string
                      maxLength: 100
                      minLength: 1
                    sic_code:
                      type: string
                      pattern: ^[0-9]{5}$
                    company_type:
                      enum:
                      - ltd
                      - plc
                      - limited-partnership
                      - lbg
                      - civic-company
                      - company-cv
                      - old-public-company
                      - public-benefit-industry-body
                      - royal-charter
                      - royal-charter-company
                      - scottish-company
                      - scottish-limited-partnership
                      - northern-ireland-company
                      - northern-ireland-unsupported-company
                      - icvc-general-public-limited-company
                      - icvc-segregated-portfolio-investment-fund
                      - icvc-open-ended-fund
                      - icvc-umbrella-open-ended-fund
                      - icvc-umbrella-segregated-portfolio-investment-fund
                      - converted-debentur
                      - continuing-regulation-fund
                      - regional-financial-co-operation
                      type: string
                    company_status:
                      enum:
                      - active
                      - dissolution
                      - liquidation
                      - receivership
                      - administration
                      - voluntary-arrangement
                      - converted
                      - ceasing-to-trade
                      - no-longer-registered
                      type: string
                    incorporated_to:
                      type: string
                      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                    incorporated_from:
                      type: string
                      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                    company_name_inclusion:
                      type: string
                      maxLength: 160
                      minLength: 1
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.records
                      value: 1
                    - type: field_changed
                      field: $.provenance.metadata_only
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.live_data
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.outbound_network_used
                      value: true
                      operator: eq
              additionalProperties: false
            example:
              input:
                limit: 10
                company_status: active
                company_name_inclusion: Macaroon
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.records
                  value: 1
                - type: field_changed
                  field: $.provenance.metadata_only
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.live_data
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.outbound_network_used
                  value: true
                  operator: eq
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - records
                    - total
                    - filters
                    - provenance
                    properties:
                      total:
                        type: integer
                      filters:
                        type: object
                      records:
                        type: array
                        maxItems: 20
                      provenance:
                        type: object
                        required:
                        - source
                        - source_endpoint
                        - retrieved_at
                        - content_hash
                        - metadata_only
                        - live_data
                        - outbound_network_used
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/companies-house-live-profile-v1:
    post:
      operationId: execute_companies_house_live_profile_v1
      summary: Live UK Company Profile & Filing Status
      description: Fetch current public-register facts for one UK company by exact company number from the official Companies House Public Data API. Returns company status and type, incorporation date, SIC codes, registered-office locality and postcode, and accounts and confirmation-statement due or overdue facts.
      tags:
      - COMPLIANCE & RISK
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - company_number
                  properties:
                    company_number:
                      type: string
                      pattern: ^[0-9A-Za-z ]+$
                      maxLength: 16
                      minLength: 1
                      description: Exact UK company number; whitespace is normalized server-side.
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: field_changed
                      field: $.record.source
                      value: Companies House Public Data API
                      operator: eq
                    - type: field_changed
                      field: $.provenance.metadata_only
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.live_data
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.outbound_network_used
                      value: true
                      operator: eq
              additionalProperties: false
            example:
              input:
                company_number: '12662363'
              predicate:
                type: all
                conditions:
                - type: field_changed
                  field: $.record.source
                  value: Companies House Public Data API
                  operator: eq
                - type: field_changed
                  field: $.provenance.metadata_only
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.live_data
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.outbound_network_used
                  value: true
                  operator: eq
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - company_number
                    - record
                    - provenance
                    properties:
                      record:
                        oneOf:
                        - type: object
                        - type: 'null'
                      provenance:
                        type: object
                        required:
                        - source
                        - source_endpoint
                        - retrieved_at
                        - content_hash
                        - metadata_only
                        - live_data
                        - outbound_network_used
                      company_number:
                        type: string
                    additionalProperties: false
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/companies-house-live-search-v1:
    post:
      operationId: execute_companies_house_live_search_v1
