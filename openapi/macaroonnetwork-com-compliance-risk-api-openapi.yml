          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - query
                  properties:
                    limit:
                      type: integer
                      default: 5
                      maximum: 5
                      minimum: 1
                    query:
                      type: string
                      maxLength: 160
                      minLength: 1
                      description: UK company name or keyword.
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.records
                      value: 1
                    - type: field_changed
                      field: $.provenance.metadata_only
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.live_data
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.outbound_network_used
                      value: true
                      operator: eq
              additionalProperties: false
            example:
              input:
                limit: 1
                query: Macaroon Network
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.records
                  value: 1
                - type: field_changed
                  field: $.provenance.metadata_only
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.live_data
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.outbound_network_used
                  value: true
                  operator: eq
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - records
                    - total
                    - query
                    - provenance
                    properties:
                      query:
                        type: string
                      total:
                        type: integer
                      records:
                        type: array
                      provenance:
                        type: object
                        required:
                        - source
                        - source_endpoint
                        - retrieved_at
                        - content_hash
                        - metadata_only
                        - live_data
                        - outbound_network_used
                    additionalProperties: false
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/nvd-cve-search-v1:
    post:
      operationId: execute_nvd_cve_search_v1
      summary: NVD CVE Vulnerability Search (Full Corpus)
      description: Search the full 100,000-record NVD (NIST) CVE corpus -- description, CVSS base score, and CVSS base severity, harvested directly from the NVD API and confirmed public domain. This is the complete harvested corpus, distinct from the smaller 1,765-record cve-search-v1 listing, which draws from a five-keyword sample cross-referenced with the CISA Known Exploited Vulnerabilities list; that KEV cross-reference is not part of this corpus.
      tags:
      - COMPLIANCE & RISK
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - query
                  - asset_types
                  - source_ids
                  properties:
                    limit:
                      type: integer
                      default: 5
                      maximum: 5
                      minimum: 1
                    query:
                      type: string
                      description: Vulnerability class, product keyword, or CVE ID, for example 'buffer overflow' or 'CVE-1999-0095'.
                    source_ids:
                      type: array
                      const:
                      - nvd-cve
                      description: Fixed source filter; send exactly ['nvd-cve'].
                    asset_types:
                      type: array
                      const:
                      - event
                      description: Fixed product filter; send exactly ['event'].
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.records
                      value: 1
                    - type: field_changed
                      field: $.provenance.metadata_only
                      value: true
                      operator: eq
                    - type: field_changed
                      field: $.provenance.no_outbound_network_on_purchase
                      value: true
                      operator: eq
              additionalProperties: false
            example:
              input:
                limit: 5
                query: buffer overflow
                source_ids:
                - nvd-cve
                asset_types:
                - event
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.records
                  value: 1
                - type: field_changed
                  field: $.provenance.metadata_only
                  value: true
                  operator: eq
                - type: field_changed
                  field: $.provenance.no_outbound_network_on_purchase
                  value: true
                  operator: eq
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - records
                    - total
                    - query
                    - provenance
                    properties:
                      query:
                        type: string
                      total:
                        type: integer
                      records:
                        type: array
                      provenance:
                        type: object
                        required:
                        - content_hash
                        - metadata_only
                        - no_outbound_network_on_purchase
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/sec-filing-search-v1:
    post:
      operationId: execute_sec_filing_search_v1
      summary: SEC Filing Search
