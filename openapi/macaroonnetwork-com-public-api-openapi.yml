openapi: 3.2.0
info:
  title: Macaroon Network Agent Services Public API
  description: Pay-per-call scientific search, evidence, validation, and simulation services with explicit provenance and limitations.
  version: 1.0.0
  x-guidance: Choose a concrete POST /execute/<capability-id> operation. Send the documented JSON body, receive an x402 v2 USDC challenge on Base, then retry with PAYMENT-SIGNATURE. Treat licence status and validation claims exactly as returned; unknown evidence is not permission.
tags:
- name: Public
paths:
  /api/public/stats:
    get:
      summary: Public Marketplace Stats
      description: 'Backs the homepage''s real "Independent Sales (24h)" stat card --

        deliberately a minimal, public-safe shape (a count and a revenue

        total), never the raw payment_reference/service_id rows

        commercial_events.commercial_report()''s unrecognized_payments list

        carries. Real, rolling 24h window -- never a hardcoded figure, per

        this project''s own "counts are never invented" rule.'
      operationId: public_marketplace_stats_api_public_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMarketplaceStatsResponse'
      tags:
      - Public
  /api/public/taxonomy:
    get:
      summary: Public Catalog Taxonomy
      description: Return Macaroon-owned canonical categories with mapped product counts.
      operationId: public_catalog_taxonomy_api_public_taxonomy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Public Catalog Taxonomy Api Public Taxonomy Get
      tags:
      - Public
  /api/public/mcp-servers:
    get:
      summary: Public Mcp Servers
      description: Return only MCP servers that are evidenced as live.
      operationId: public_mcp_servers_api_public_mcp_servers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Public Mcp Servers Api Public Mcp Servers Get
      tags:
      - Public
  /api/public/sources:
    get:
      summary: Public Sources
      description: Return reviewed public source records and explicit coverage limits.
      operationId: public_sources_api_public_sources_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Public Sources Api Public Sources Get
      tags:
      - Public
  /api/public/services:
    get:
      summary: Public Services
      operationId: public_services_api_public_services_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Category
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicServicesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Public
  /api/public/services/search:
    get:
      summary: Public Service Search
      operationId: public_service_search_api_public_services_search_get
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
          title: Query
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Category
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicServicesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Public
  /api/public/gpt/faith/scripture-lookup:
    post:
      summary: Public Gpt Faith Scripture Lookup
      description: Return at most five exact, same-chapter verses from the pinned corpus.
      operationId: public_gpt_faith_scripture_lookup_api_public_gpt_faith_scripture_lookup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GPTScriptureLookupRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Public Gpt Faith Scripture Lookup Api Public Gpt Faith Scripture Lookup Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Public
  /api/public/gpt/faith/action:
    post:
      summary: Public Gpt Faith Action
      description: Single Builder-compatible dispatcher with a server-fixed faith scope.
      operationId: public_gpt_faith_action_api_public_gpt_faith_action_post
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/GPTFaithScriptureActionRequest'
              - $ref: '#/components/schemas/GPTFaithListActionRequest'
              - $ref: '#/components/schemas/GPTFaithSearchActionRequest'
              - $ref: '#/components/schemas/GPTFaithServiceActionRequest'
              title: Body
              discriminator:
                propertyName: action
                mapping:
                  scripture_lookup: '#/components/schemas/GPTFaithScriptureActionRequest'
                  list_services: '#/components/schemas/GPTFaithListActionRequest'
                  search_services: '#/components/schemas/GPTFaithSearchActionRequest'
                  service_detail: '#/components/schemas/GPTFaithServiceActionRequest'
                  service_evidence: '#/components/schemas/GPTFaithServiceActionRequest'
                  service_page: '#/components/schemas/GPTFaithServiceActionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Public Gpt Faith Action Api Public Gpt Faith Action Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Public
  /api/public/gpt/faith/services/list:
