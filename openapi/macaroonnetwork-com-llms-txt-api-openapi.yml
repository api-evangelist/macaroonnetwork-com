openapi: 3.2.0
info:
  title: Macaroon Network Agent Services Llms.txt API
  description: Pay-per-call scientific search, evidence, validation, and simulation services with explicit provenance and limitations.
  version: 1.0.0
  x-guidance: Choose a concrete POST /execute/<capability-id> operation. Send the documented JSON body, receive an x402 v2 USDC challenge on Base, then retry with PAYMENT-SIGNATURE. Treat licence status and validation claims exactly as returned; unknown evidence is not permission.
tags:
- name: Llms.txt
paths:
  /llms.txt:
    get:
      summary: Llms Txt
      description: 'llms.txt (llmstxt.org convention -- not a ratified standard, but a

        widely-adopted one). Root path is the dominant convention; the

        /.well-known mirror is served too since 2026-08-16 production logs

        show real crawlers checking that path specifically. Listing count is

        computed live, never a hardcoded figure that could go stale or

        overclaim.'
      operationId: llms_txt_llms_txt_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Llms.txt
