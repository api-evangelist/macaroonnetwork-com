openapi: 3.2.0
info:
  title: Macaroon Network Agent Services DATA LOOKUP API
  description: Pay-per-call scientific search, evidence, validation, and simulation services with explicit provenance and limitations.
  version: 1.0.0
  x-guidance: Choose a concrete POST /execute/<capability-id> operation. Send the documented JSON body, receive an x402 v2 USDC challenge on Base, then retry with PAYMENT-SIGNATURE. Treat licence status and validation claims exactly as returned; unknown evidence is not permission.
tags:
- name: DATA LOOKUP
paths:
  /execute/tx-new-business-change-feed-v1:
    post:
      operationId: execute_tx_new_business_change_feed_v1
      summary: Texas New Business Registration Change Feed
      description: 'Weekly change feed over the Texas Comptroller''s real Active Franchise Taxpayers register: which taxpayer_numbers newly appeared on the roster since a given date -- a free-data, honest-cadence answer to the ''reach the owner of a newly formed business'' demand. Diffed against the prior week''s snapshot each time the Comptroller republishes the dataset (real-tested 2026-09-11: roughly weekly, not daily).'
      tags:
      - DATA LOOKUP
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - since
                  properties:
                    limit:
                      type: integer
                      maximum: 100
                      minimum: 1
                      description: Maximum number of change events to return.
                    since:
                      type: string
                      description: ISO-8601 timestamp -- only new_registration events detected at or after this are returned.
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: field_changed
                      field: $.since
                      value: '2020-01-01T00:00:00+00:00'
                      operator: eq
                    - type: within
                      field: $.retrieved_at
                      duration_hours: 1
              additionalProperties: false
            example:
              input:
                limit: 20
                since: '2026-09-01T00:00:00+00:00'
              predicate:
                type: all
                conditions:
                - type: field_changed
                  field: $.since
                  value: '2020-01-01T00:00:00+00:00'
                  operator: eq
                - type: within
                  field: $.retrieved_at
                  duration_hours: 1
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - since
                    - events
                    - retrieved_at
                    - limitations
                    properties:
                      since:
                        type: string
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            event_type:
                              enum:
                              - new_registration
                              type: string
                            detected_at:
                              type: string
                            taxpayer_zip:
                              type: string
                            taxpayer_city:
                              type: string
                            taxpayer_name:
                              type: string
                            taxpayer_state:
                              type: string
                            taxpayer_number:
                              type: string
                            taxpayer_address:
                              type: string
                            taxpayer_organizational_type:
                              type: string
                      limitations:
                        type: array
                        items:
                          type: string
                      retrieved_at:
                        type: string
                    additionalProperties: false
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/uk-logistics-operator-change-feed-v1:
    post:
      operationId: execute_uk_logistics_operator_change_feed_v1
      summary: UK Logistics Operator Change Feed
      description: 'Weekly change feed over DVSA''s real UK Vehicle Operator Licensing register: which goods vehicle/PSV operators had a real licence status change (curtailed/suspended), a fleet size change, or entered/left the register since a given date. Built on the same real national dataset as uk-logistics-operator-risk-check-v1, diffed against the prior week''s snapshot every Sunday when DVSA republishes.'
      tags:
      - DATA LOOKUP
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - since
                  properties:
                    limit:
                      type: integer
                      maximum: 100
                      minimum: 1
                      description: Maximum number of change events to return.
                    since:
                      type: string
                      description: ISO-8601 timestamp -- only change events detected at or after this are returned.
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: field_changed
                      field: $.since
                      value: '2020-01-01T00:00:00+00:00'
                      operator: eq
                    - type: within
                      field: $.retrieved_at
                      duration_hours: 1
              additionalProperties: false
            example:
              input:
                limit: 20
                since: '2026-09-01T00:00:00+00:00'
              predicate:
                type: all
                conditions:
                - type: field_changed
                  field: $.since
                  value: '2020-01-01T00:00:00+00:00'
                  operator: eq
                - type: within
                  field: $.retrieved_at
                  duration_hours: 1
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - since
                    - events
                    - retrieved_at
                    - limitations
                    properties:
                      since:
                        type: string
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            event_type:
                              enum:
                              - new_operator
                              - operator_removed
                              - licence_status_changed
                              - fleet_size_changed
                              type: string
                            detected_at:
                              type: string
                            operator_name:
                              type: string
                            licence_number:
                              type: string
                      limitations:
                        type: array
                        items:
                          type: string
                      retrieved_at:
                        type: string
                    additionalProperties: false
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/uk-logistics-operator-risk-check-v1:
    post:
      operationId: execute_uk_logistics_operator_risk_check_v1
      summary: UK Logistics Operator Risk Check
      description: 'Search DVSA''s real, live UK Vehicle Operator Licensing register -- every goods vehicle and PSV operator licence in Great Britain (69,127 operators, updated weekly) -- for a haulier or logistics operator by name. Returns licence status, authorised fleet size, and cross-references the operator''s real Companies House status to flag a rare but real risk: a licence that still reads valid while the operator''s actual registered company is dissolved or in liquidation.'
      tags:
      - DATA LOOKUP
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.005000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - query
                  properties:
                    limit:
                      type: integer
                      maximum: 10
                      minimum: 1
                      description: Maximum number of matching operators to return.
                    query:
                      type: string
                      maxLength: 200
                      minLength: 1
                      description: Operator name or substring, e.g. 'Rhenus' or 'Wincanton'.
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.results
                      value: 1
              additionalProperties: false
            example:
              input:
                limit: 5
                query: rhenus
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.results
                  value: 1
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - query
                    - results
                    - limitations
                    properties:
                      query:
                        type: string
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            region:
                              type: string
                            risk_flags:
                              type: array
                              items:
                                enum:
                                - licence_curtailed
                                - licence_suspended
                                - company_dissolved_but_licence_valid
                                type: string
                            licence_type:
                              type: string
                            operator_name:
                              type: string
                            operator_type:
                              type: string
                            company_number:
                              type:
                              - string
                              - 'null'
                            company_status:
                              type:
                              - string
                              - 'null'
                            licence_number:
                              type: string
                            licence_status:
                              enum:
                              - valid
                              - curtailed
                              - suspended
                              - unknown
                              type: string
                            continuation_date:
                              type:
                              - string
                              - 'null'
                            trailers_authorised:
                              type: integer
                            vehicles_authorised:
                              type: integer
                            correspondence_address:
                              type: string
                            operating_centre_address:
                              type: string
                          additionalProperties: false
                      limitations:
                        type: array
                        items:
                          type: string
                    additionalProperties: false
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/nhtsa-vehicle-recall-search-v1:
    post:
      operationId: execute_nhtsa_vehicle_recall_search_v1
      summary: NHTSA Vehicle Recall Search
      description: Look up official U.S. vehicle safety recalls by make, model, and model year -- campaign number, affected component, defect summary, safety consequence, and remedy. The only source used is the National Highway Traffic Safety Administration's own public API (api.nhtsa.gov). Restricted to recall lookup only for v1; NHTSA safety ratings and complaint records are a different part of the same API family and are not covered.
      tags:
      - DATA LOOKUP
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - make
                  - model
                  - model_year
                  properties:
                    make:
                      type: string
                      maxLength: 100
                      minLength: 1
                      description: Vehicle manufacturer, e.g. 'honda'.
                    model:
                      type: string
                      maxLength: 100
                      minLength: 1
                      description: Vehicle model, e.g. 'accord'.
                    model_year:
                      type: integer
                      maximum: 2100
                      minimum: 1950
                      description: Four-digit model year, e.g. 2020.
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.results
                      value: 1
              additionalProperties: false
            example:
              input:
                make: honda
                model: accord
                model_year: 2020
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.results
                  value: 1
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - query
                    - results
                    - notices
                    properties:
                      query:
                        type: object
                        required:
                        - make
                        - model
                        - model_year
                        properties:
                          make:
                            type: string
                          model:
                            type: string
                          model_year:
                            type: integer
                        additionalProperties: false
                      notices:
                        type: array
                        items:
                          type: string
                      results:
                        type: array
                        items:
                          type: object
                          required:
                          - campaign_number
                          - manufacturer
                          - component
                          - summary
                          - consequence
                          - remedy
                          - report_received_date
                          - park_it
                          - park_outside
                          - over_the_air_update
                          - licence
                          - attribution
                          - provenance
                          - content_hash
                          - limitations
                          properties:
                            notes:
                              type: string
                            remedy:
                              type: string
                            licence:
                              type: string
                            park_it:
                              type: boolean
                            summary:
                              type: string
                            component:
                              type: string
                            provenance:
                              type: array
                              items:
                                type: object
                                required:
                                - source
                                - source_url
                                - licence
                                - fetched_at
                                - processed_at
                                properties:
                                  source:
                                    type: string
                                  licence:
                                    type: string
                                  fetched_at:
                                    type: string
                                  source_url:
                                    type: string
                                  processed_at:
                                    type: string
                                additionalProperties: false
                            attribution:
                              type: string
                            consequence:
                              type: string
                            limitations:
                              type: array
                              items:
                                type: string
                            content_hash:
                              type: string
                            manufacturer:
                              type: string
                            park_outside:
                              type: boolean
                            campaign_number:
                              type: string
                            over_the_air_update:
                              type: boolean
                            report_received_date:
                              type: string
                          additionalProperties: false
                    additionalProperties: false
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/us-weather-forecast-alerts-v1:
    post:
      operationId: execute_us_weather_forecast_alerts_v1
      summary: US Weather Forecast & Alerts
      description: Live multi-day forecast and currently active weather alerts (severe thunderstorm, flood, winter storm, etc.) for a single latitude/longitude point, from the U.S. National Weather Service's own public API (api.weather.gov). Coverage is limited to the United States, its territories, and adjacent coastal/marine zones -- api.weather.gov has no data for points outside that area.
      tags:
      - DATA LOOKUP
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - latitude
                  - longitude
                  properties:
                    filters:
                      type: object
                      properties:
                        periods_limit:
                          type: integer
                          maximum: 14
                          minimum: 1
                          description: Number of forecast periods to return (each period is roughly a day or night). Defaults to 5.
                        include_alerts:
                          type: boolean
                          description: Whether to include currently active weather alerts for this point. Defaults to true.
                      additionalProperties: false
                    latitude:
                      type: number
                      maximum: 90
                      minimum: -90
                    longitude:
                      type: number
                      maximum: 180
                      minimum: -180
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.forecast
                      value: 1
              additionalProperties: false
            example:
              input:
                filters:
                  periods_limit: 5
                latitude: 38.8894
                longitude: -77.0352
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.forecast
                  value: 1
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - latitude
                    - longitude
                    - forecast_updated
                    - forecast
                    - alerts
                    - provenance
                    - content_hash
                    - notices
                    properties:
                      city:
                        type: string
                      state:
                        type: string
                      alerts:
                        type: array
                        items:
                          type: object
                          required:
                          - event
                          - severity
                          - urgency
                          - certainty
                          - headline
                          - area_desc
                          - effective
                          - expires
                          properties:
                            event:
                              type: string
                            expires:
                              type: string
                            urgency:
                              type: string
                            headline:
                              type: string
                            severity:
                              type: string
                            area_desc:
                              type: string
                            certainty:
                              type: string
                            effective:
                              type: string
                            description:
                              type: string
                            instruction:
                              type: string
                          additionalProperties: false
                      notices:
                        type: array
                        items:
                          type: string
                      forecast:
                        type: array
                        items:
                          type: object
                          required:
                          - number
                          - name
                          - start_time
                          - end_time
                          - is_daytime
                          - temperature
                          - temperature_unit
                          - wind_speed
                          - wind_direction
                          - short_forecast
                          - detailed_forecast
                          properties:
                            name:
                              type: string
                            number:
                              type: integer
                            end_time:
                              type: string
                            is_daytime:
                              type: boolean
                            start_time:
                              type: string
                            wind_speed:
                              type: string
                            temperature:
                              type: number
                            short_forecast:
                              type: string
                            wind_direction:
                              type: string
                            temperature_unit:
                              type: string
                            detailed_forecast:
                              type: string
                            probability_of_precipitation_percent:
                              type: number
                          additionalProperties: false
                      latitude:
                        type: number
                      longitude:
                        type: number
                      provenance:
                        type: object
                        required:
                        - source
                        - source_url
                        - licence
                        - fetched_at
                        properties:
                          source:
                            type: string
                          licence:
                            type: string
                          fetched_at:
                            type: string
                          source_url:
                            type: string
                        additionalProperties: false
                      content_hash:
                        type: string
                      forecast_updated:
                        type: string
                    additionalProperties: false
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/uk-parliament-search-v1:
    post:
      operationId: execute_uk_parliament_search_v1
      summary: UK Parliament Search
      description: 'Search live UK Parliament data: Members (current and former MPs and Peers, by name) and Bills (by title). The only sources used are the UK Parliament''s own public Members API (members-api.parliament.uk) and Bills API (bills-api.parliament.uk), both unauthenticated. Votes and Divisions data (a different API family) is out of scope for this version.'
      tags:
      - DATA LOOKUP
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.002000'
        protocols:
        - x402: {}
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - search_type
                  - query
                  properties:
                    query:
                      type: string
                      maxLength: 200
                      minLength: 1
                      description: 'For search_type=member: a name to search (e.g. ''Starmer''). For search_type=bill: a free-text term matched against bill titles (e.g. ''data protection'').'
                    filters:
                      type: object
                      properties:
                        house:
                          enum:
                          - Commons
                          - Lords
                          type: string
                          description: 'Member search: filter by House. Bill search: filter by the bill''s current House.'
                        limit:
                          type: integer
                          maximum: 25
                          minimum: 1
                        current_members_only:
                          type: boolean
                          description: Member search only. Defaults to false (searches current and former members).
                      additionalProperties: false
                    search_type:
                      enum:
                      - member
                      - bill
                      type: string
                      description: '"member" searches current and former MPs/Peers by name. "bill" searches Parliamentary bills by title.'
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.results
                      value: 1
              additionalProperties: false
            example:
              input:
                query: data protection
                filters:
                  house: Commons
                  limit: 5
                search_type: bill
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.results
                  value: 1
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - query
                    - results
                    - notices
                    properties:
                      query:
                        type: object
                        required:
                        - search_type
                        - query
                        - filters
                        properties:
                          query:
                            type: string
                          filters:
                            type: object
                          search_type:
                            type: string
                        additionalProperties: false
                      notices:
                        type: array
                        items:
                          type: string
                      results:
                        type: array
                        items:
                          oneOf:
                          - type: object
                            required:
                            - result_type
                            - member_id
                            - name_display_as
                            - party
                            - house
                            - membership_from
                            - is_current_member
                            - source_url
                            - licence
                            - attribution
                            - provenance
                            - content_hash
                            - limitations
                            properties:
                              house:
                                enum:
                                - Commons
                                - Lords
                                - unknown
                                type: string
                              party:
                                type: string
                              licence:
