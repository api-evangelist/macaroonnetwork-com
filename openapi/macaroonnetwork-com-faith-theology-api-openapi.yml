openapi: 3.2.0
info:
  title: Macaroon Network Agent Services FAITH & THEOLOGY API
  description: Pay-per-call scientific search, evidence, validation, and simulation services with explicit provenance and limitations.
  version: 1.0.0
  x-guidance: Choose a concrete POST /execute/<capability-id> operation. Send the documented JSON body, receive an x402 v2 USDC challenge on Base, then retry with PAYMENT-SIGNATURE. Treat licence status and validation claims exactly as returned; unknown evidence is not permission.
tags:
- name: FAITH & THEOLOGY
paths:
  /execute/christian-scripture-passage-context-v1:
    post:
      operationId: execute_christian_scripture_passage_context_v1
      summary: Christian Scripture Passage Context
      description: Return a requested verse plus up to ten same-chapter verses before and after from a pinned public-domain corpus.
      tags:
      - FAITH & THEOLOGY
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.001000'
        protocols:
        - x402: {}
        paymentOffers:
        - intent: exact
          limits:
            per_call_atomic: 1000
          network: base
          currency: USDC
          protocol: x402
          provider: configured_facilitator
          availability: live
          unit_amount_atomic: 1000
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - book_id
                  - chapter
                  - verse
                  properties:
                    after:
                      type: integer
                      default: 3
                      maximum: 10
                      minimum: 0
                    verse:
                      type: integer
                      maximum: 176
                      minimum: 1
                    before:
                      type: integer
                      default: 3
                      maximum: 10
                      minimum: 0
                    book_id:
                      type: string
                      maxLength: 24
                      minLength: 2
                    chapter:
                      type: integer
                      maximum: 150
                      minimum: 1
                    source_id:
                      enum:
                      - bsb
                      - web
                      type: string
                      default: bsb
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.evidence
                      value: 1
                    - type: field_changed
                      field: $.product
                      value: scripture_passage_context
                      operator: eq
                    - type: field_changed
                      field: $.provenance.runtime_outbound_network_used
                      value: false
                      operator: eq
              additionalProperties: false
            example:
              input:
                after: 2
                verse: 16
                before: 2
                book_id: JHN
                chapter: 3
                source_id: web
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.evidence
                  value: 1
                - type: field_changed
                  field: $.product
                  value: scripture_passage_context
                  operator: eq
                - type: field_changed
                  field: $.provenance.runtime_outbound_network_used
                  value: false
                  operator: eq
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - product
                    - reference
                    - requested_verse
                    - evidence
                    - source_labels
                    - provenance
                    - limitations
                    properties:
                      product:
                        const: scripture_passage_context
                      evidence:
                        type: array
                        maxItems: 21
                        minItems: 1
                      reference:
                        type: string
                      provenance:
                        type: object
                      limitations:
                        type: array
                      source_labels:
                        type: array
                      requested_verse:
                        type: integer
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
  /execute/christian-scripture-keyword-search-v1:
    post:
      operationId: execute_christian_scripture_keyword_search_v1
      summary: Christian Scripture Keyword Search
      description: Literal concordance-style search over a pinned public-domain Bible corpus, with bounded source-labelled evidence.
      tags:
      - FAITH & THEOLOGY
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.001000'
        protocols:
        - x402: {}
        paymentOffers:
        - intent: exact
          limits:
            per_call_atomic: 1000
          network: base
          currency: USDC
          protocol: x402
          provider: configured_facilitator
          availability: live
          unit_amount_atomic: 1000
        network: base
        asset: USDC
        paymentRequiredHeader: PAYMENT-REQUIRED
        paymentSignatureHeader: PAYMENT-SIGNATURE
        paymentResponseHeader: PAYMENT-RESPONSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - predicate
              properties:
                input:
                  type: object
                  required:
                  - query
                  properties:
                    limit:
                      type: integer
                      default: 10
                      maximum: 20
                      minimum: 1
                    query:
                      type: string
                      pattern: ^[A-Za-z][A-Za-z '’-]{1,39}$
                      maxLength: 40
                      minLength: 2
                    source_id:
                      enum:
                      - bsb
                      - web
                      type: string
                      default: bsb
                  additionalProperties: false
                predicate:
                  type: object
                  description: Acceptance predicate evaluated before settlement.
                  example:
                    type: all
                    conditions:
                    - type: count_gte
                      field: $.evidence
                      value: 1
                    - type: field_changed
                      field: $.product
                      value: scripture_keyword_search
                      operator: eq
                    - type: field_changed
                      field: $.provenance.runtime_outbound_network_used
                      value: false
                      operator: eq
              additionalProperties: false
            example:
              input:
                limit: 5
                query: hope
                source_id: bsb
              predicate:
                type: all
                conditions:
                - type: count_gte
                  field: $.evidence
                  value: 1
                - type: field_changed
                  field: $.product
                  value: scripture_keyword_search
                  operator: eq
                - type: field_changed
                  field: $.provenance.runtime_outbound_network_used
                  value: false
                  operator: eq
      responses:
        '200':
          description: Predicate-gated result and commercial receipt.
          content:
            application/json:
              schema:
                type: object
                required:
                - payload
                - predicate_passed
                - receipt
                properties:
                  payload:
                    type: object
                    required:
                    - product
                    - query
                    - total
                    - evidence
                    - source_labels
                    - provenance
                    - limitations
                    properties:
                      query:
                        type: string
                      total:
                        type: integer
                        maximum: 20
                        minimum: 0
                      product:
                        const: scripture_keyword_search
                      evidence:
                        type: array
                        maxItems: 20
                        minItems: 1
                      provenance:
                        type: object
                      limitations:
                        type: array
                      source_labels:
                        type: array
                  predicate_passed:
                    type: boolean
                  receipt:
                    type: object
        '402':
          description: x402 Payment Required. Decode PAYMENT-REQUIRED, satisfy the declared exact USDC requirement, then retry this same valid JSON request with PAYMENT-SIGNATURE.
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 payment requirements.
              schema:
                type: string
        '422':
          description: Invalid paid execution request.
