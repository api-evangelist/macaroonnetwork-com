description: >-
  Derived from the 29 component schemas in the OpenAPI ($ref links: ListingsResponse->Listing,
  SearchResponse->SearchResultListing, PublicServicesResponse->PublicServiceSummary,
  AgentCapabilitiesResponse->CapabilityEntry, AgentCatalogResponse->AgentCatalogCapability,
  HTTPValidationError->ValidationError) and the id-reference fields observed in the live registries
  (provider_id, category_id, mcp_server_id, source_ids, service_id, predicate_hash, receipt_id). The catalogue
  is one product graph projected four ways — Listing (registry), CapabilityEntry (agent-capabilities),
  AgentCatalogCapability (ai-catalog) and PublicServiceSummary/Detail (public services) all key on the same
  capability id.
entities:
- {name: Capability, id_field: capability_id / service_id / id, domain: catalogue, description: One sellable capability (e.g. vat-validate-v1); the join key across every surface — OpenAPI path, A2A skill, MCP capability_id, api-catalog anchor, x402 resource URL, listing page slug.}
- {name: Listing, schema: Listing, domain: registry, description: Registry row for a capability — version, provider, endpoint, price_sats, input_schema, output_schema, sample_predicate, predicate_hash, policy, status, payment.}
- {name: SearchResultListing, schema: SearchResultListing, domain: registry, description: Listing plus a similarity score from intent search.}
- {name: CapabilityEntry, schema: CapabilityEntry, domain: agent-discovery, description: The /.well-known/agent-capabilities projection — price, predicate_hash, badges, payment_rails, payment_offers, free_tier, representative_queries, schemas.}
- {name: AgentCatalogCapability, schema: AgentCatalogCapability, domain: agent-discovery, description: The /.well-known/ai-catalog.json projection — adds validation (with on-chain evidence), validation_staking and subscriptions.}
- {name: PublicServiceSummary, schema: PublicServiceSummary, domain: public-catalogue, description: Human/GPT-facing service row with category, mcp_server_id, source_ids, price object, trust_status, service_url.}
- {name: PublicServiceDetail, schema: PublicServiceDetail, domain: public-catalogue, description: Summary plus provider, inputs, outputs.}
- {name: Provider, id_field: provider_id, domain: registry, description: The party operating a listing — polymathica (47), macaroon (25), macaroon-faith (11), postcodes-io (1), macaroonnetwork (1) on 2026-09-19.}
