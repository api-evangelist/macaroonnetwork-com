- {name: Source, id_field: source id, domain: rights, description: 'A reviewed upstream data source (schema macaroon.source-registry.v1): operator, access_method, authentication, commercial_mode, rights_status, rights_evidence_url, attribution/provenance flags, last_verified_at.'}
- {name: MCPServer, id_field: mcp server id, domain: distribution, description: 'A Macaroon MCP server (schema macaroon.mcp-registry.v1): role, category_ids, official_registry_name, transports.'}
