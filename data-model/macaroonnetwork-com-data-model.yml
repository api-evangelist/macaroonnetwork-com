- {name: PaymentRail, domain: settlement, description: 'x402_base_usdc / x402_polygon_usdc / l402_lightning with status, network, chain_id, settlement mode, amount_atomic.'}
- {name: PaymentOffer, domain: settlement, description: 'protocol, intent (exact), currency, unit_amount_atomic, network, provider, availability.'}
- {name: Receipt, schema: ReceiptResponse, id_field: receipt_id, domain: settlement, description: Commercial receipt for one execution — payment reference/protocol/provider, settlement_state, amount, predicate result, execution and validation run ids, result_hash.}
