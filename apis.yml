- aid: macaroonnetwork-com:bible-evidence-mcp
  name: Macaroon Bible Evidence MCP Server
  description: >-
    A free, read-only Streamable HTTP MCP server at https://api.macaroonnetwork.com/mcp-faith-evidence-v1/mcp/
    (serverInfo macaroon-bible-evidence 0.3.0) exposing eleven bounded tools over pinned Berean Standard Bible
    and World English Bible corpora — exact verse lookup, passage context, BSB/WEB comparison, OpenBible
    cross-references, literal search, topic evidence guides and discovery of the paid Christian services. No
    wallet, purchase or execution tool is exposed. Listed in the official MCP registry as
    com.macaroonnetwork/bible-evidence.
  tags:
