- aid: macaroonnetwork-com:mcp-server
  name: Macaroon Network MCP Server
  description: >-
    The network router MCP server — a live Streamable HTTP endpoint at https://api.macaroonnetwork.com/mcp
    (serverInfo macaroon-network 0.3.0, protocol 2025-06-18) answering initialize and tools/list anonymously
    with four tools (macaroons_search, macaroons_metadata, macaroons_purchase, macaroons_execute), plus
    the same router shipped as a stdio package (pip install macaroonnetwork-mcp, PyPI 0.4.0) listed in
    the official MCP registry as com.macaroonnetwork/mcp-server. Paid tool calls return the real x402
    challenge for the caller's own wallet to sign; the server never holds a wallet.
  tags:
  - MCP
  - Agentic Commerce
  - x402
  tags_raw:
  - MCP
  - Agent Commerce
  - x402
