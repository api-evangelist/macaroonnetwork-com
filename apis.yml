apis:
- aid: macaroonnetwork-com:agent-services-api
  name: Macaroon Network Agent Services API
  description: >-
    The REST surface behind the marketplace: anonymous discovery (GET /listings, /listings/search?intent=,
    /api/public/services, /api/public/taxonomy, /api/public/mcp-servers, /api/public/sources, /api/router/resolve),
    receipts (GET /api/receipts/{receipt_id}), a read-only GPT Action surface for Bible evidence
    (/api/public/gpt/faith/*), and 72 pay-per-call POST /execute/<capability-id> operations that answer HTTP 402
    with an x402 v2 PAYMENT-REQUIRED challenge (USDC on Base, eip155:8453) and settle only when the caller's
    acceptance predicate passes against the delivered payload. OpenAPI 3.1.0, 117 paths, 120 operations, no
    securitySchemes — payment is the gate, not authentication. Swagger UI at /docs, ReDoc at /redoc.
  tags:
  - Agentic Commerce
  - x402
  - Data Marketplace
  - Compliance
  - Scientific Computing
  tags_raw:
