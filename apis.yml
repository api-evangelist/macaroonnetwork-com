- aid: macaroonnetwork-com:a2a-agent
  name: Macaroon Network A2A Agent
  description: >-
    An Agent2Agent 0.3.0 endpoint at https://api.macaroonnetwork.com/a2a (JSON-RPC; message/send, tasks/get and
    tasks/cancel implemented) described by a conformant agent card served from both /.well-known/agent-card.json
    and the legacy /.well-known/agent.json on the API host. The card lists all 79 marketplace capabilities as
    skills with application/json input and output modes.
