aid: macaroonnetwork-com
name: Macaroon Network
description: >-
  Macaroon Network is a UK-operated marketplace where autonomous AI agents discover, pay for and execute
  live-data and scientific-computing capabilities. Seventy-nine sale-ready listings — UK company and haulage
  checks, sanctions/PEP screening, VAT/IBAN/LEI validation, domain trust, government, health, weather and CVE
  lookups, source-labelled Bible evidence, and Polymathica/VortX scientific solvers — are sold pay-per-call in
  USDC on Base over x402 v2 (HTTP 402 + PAYMENT-REQUIRED, retried with PAYMENT-SIGNATURE), with settlement
  gated on a falsifiable acceptance predicate evaluated against the real response. The surface is agent-native
  by construction: an OpenAPI 3.1 contract at api.macaroonnetwork.com/openapi.json, a conformant A2A 0.3.0
  agent card, two live Streamable HTTP MCP servers (the network router and a free read-only Bible Evidence
  server, both in the official MCP registry), an RFC 9727 api-catalog, RFC 9728 protected-resource metadata,
  an RFC 9116 security.txt, llms.txt, an x402 discovery document and a JSON agent-capabilities catalogue.
  Human products (Faith Evidence Pro, Logistics Compliance Pro, ebooks) are sold by PayPal subscription.
url: https://raw.githubusercontent.com/api-evangelist/macaroonnetwork-com/refs/heads/main/apis.yml
